<meta charset="utf-8">
<title>IFRS 15 Revenue Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a sunny playroom. Hero (greeting + fox friend) → progress tiles → wish journey → colorful step cards. Play screens take on their step's color. */
:root {
  --bg: #EFF5FC;
  --surface: #FFFFFF;
  --surface-2: #F5F9FE;
  --ink: #1D2943;
  --muted: #5B6A86;
  --line: #DCE5F1;
  --accent: #2272E6;
  --accent-deep: #1856B5;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3EFFF;
  --gold: #C98200;
  --gold-soft: #FFF2CC;
  --good: #129468;
  --good-soft: #DDF6EC;
  --bad: #DB5246;
  --bad-soft: #FFE6E2;
  --s1: #3D95FF; --s1-soft: #E1EEFF;
  --s2: #22B68B; --s2-soft: #D9F4EA;
  --s3: #FFB627; --s3-soft: #FFF1D3;
  --s4: #FF7466; --s4-soft: #FFE5E1;
  --s5: #8F70F7; --s5-soft: #EDE7FF;
  --s6: #26325C; --s6-soft: #E2E7F5;
  --tone: var(--s1);
  --tone-soft: var(--s1-soft);
  --on-tone: #14203A;
  --on-sun: #3A2600;
  --sun-deep: #D48C08;
  --boss: #26325C;
  --boss-ink: #F3F6FF;
  --lift: 0 12px 32px -16px rgba(29, 41, 67, .28);
  --fox: #F4A57C;
  --fox-dark: #E3875F;
  --cream: #FFF5EA;
  --ear: #F8C6D0;
  --blush: #F49CB0;
  --nose: #4A3A40;
  --hi: #FFFFFF;
  --acorn: #D69A5E;
  --acorn-cap: #8E6240;
  --c1: #EE8A8A;
  --c2: #EDB04F;
  --c3: #6DBE9B;
  --c4: #8AA3E6;
  --c5: #B98ADB;
  --night: #2D2B4E;
  --night-2: #46407A;
  --shadow: rgba(16, 32, 60, .10);
  --den: #FFF0E6;
  --den-2: #E6F4FF;
  --paper: #FFFDF8;
  --sky: #D6EAF8;
  --mint: #CDEBDD;
  --lav: #E2DAF6;
  --butter: #FBEBB5;
  --sil: #A9B5C8;
  --font-display: "Fredoka", "Nunito", "Segoe UI", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101729; --surface: #19233A; --surface-2: #1F2A45; --ink: #ECF1FF; --muted: #A0ADCC; --line: #2C3858;
    --accent: #5C9DFF; --accent-deep: #2D67C9; --accent-ink: #0B1224; --accent-soft: #1D2D52;
    --gold: #FFC24D; --gold-soft: #3A2F14; --good: #3DD6A0; --good-soft: #143A2E; --bad: #FF8A7E; --bad-soft: #45221F;
    --s1: #66ACFF; --s1-soft: #1B2D4F; --s2: #3DD6A0; --s2-soft: #14372D; --s3: #FFC24D; --s3-soft: #3A2F14;
    --s4: #FF8A7E; --s4-soft: #45221F; --s5: #A88FFF; --s5-soft: #2A2452; --s6: #C7D2F5; --s6-soft: #252E4D;
    --sun-deep: #B8800F; --boss: #2B3868; --lift: 0 12px 32px -16px rgba(0, 0, 0, .7);
    --shadow: rgba(0, 0, 0, .35); --den: #2A2335; --den-2: #172A3D; --paper: #2A2833;
    --sky: #2E3B57; --mint: #27443A; --lav: #383250; --butter: #463E22; --sil: #3E4A66;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101729; --surface: #19233A; --surface-2: #1F2A45; --ink: #ECF1FF; --muted: #A0ADCC; --line: #2C3858;
  --accent: #5C9DFF; --accent-deep: #2D67C9; --accent-ink: #0B1224; --accent-soft: #1D2D52;
  --gold: #FFC24D; --gold-soft: #3A2F14; --good: #3DD6A0; --good-soft: #143A2E; --bad: #FF8A7E; --bad-soft: #45221F;
  --s1: #66ACFF; --s1-soft: #1B2D4F; --s2: #3DD6A0; --s2-soft: #14372D; --s3: #FFC24D; --s3-soft: #3A2F14;
  --s4: #FF8A7E; --s4-soft: #45221F; --s5: #A88FFF; --s5-soft: #2A2452; --s6: #C7D2F5; --s6-soft: #252E4D;
  --sun-deep: #B8800F; --boss: #2B3868; --lift: 0 12px 32px -16px rgba(0, 0, 0, .7);
  --shadow: rgba(0, 0, 0, .35); --den: #2A2335; --den-2: #172A3D; --paper: #2A2833;
  --sky: #2E3B57; --mint: #27443A; --lav: #383250; --butter: #463E22; --sil: #3E4A66;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16.5px; line-height: 1.55; font-variant-numeric: tabular-nums; }
.sky { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.sky i { position: absolute; border-radius: 50%; }
.sky i:nth-child(1) { width: 560px; height: 560px; top: -200px; left: -160px; background: radial-gradient(circle, var(--s1-soft) 0%, transparent 68%); }
.sky i:nth-child(2) { width: 520px; height: 520px; top: 18%; right: -200px; background: radial-gradient(circle, var(--s3-soft) 0%, transparent 68%); }
.sky i:nth-child(3) { width: 640px; height: 640px; bottom: -260px; left: 25%; background: radial-gradient(circle, var(--s2-soft) 0%, transparent 68%); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 56px; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; line-height: 1.1; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 12px; }
.mono { font-variant-numeric: tabular-nums; font-weight: 800; }
.eyebrow { font-size: 12.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hint { font-size: 14.5px; color: var(--muted); }

/* buttons */
.btn { --b: var(--accent); --bd: var(--accent-deep); --bi: var(--accent-ink); background: var(--b); color: var(--bi); border: 0; border-radius: 999px; padding: 12px 24px; font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: .01em; box-shadow: 0 4px 0 var(--bd); transition: transform .12s ease, box-shadow .12s ease, filter .15s ease; }
.btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 0 var(--bd); filter: brightness(1.05); }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--bd); }
.btn:disabled { opacity: .45; }
.btn.sun { --b: var(--s3); --bd: var(--sun-deep); --bi: var(--on-sun); }
.btn.ghost { --b: var(--surface); --bd: var(--line); --bi: var(--ink); border: 2px solid var(--line); }
.btn.small { padding: 8px 16px; font-size: 15px; box-shadow: 0 3px 0 var(--bd); }
.btn.big { padding: 15px 30px; font-size: 19px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; font-weight: 700; }
.linkbtn.armed { color: var(--bad); }
.actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 14px; }
.top-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; }
.brand-mark { width: 40px; height: 40px; border-radius: 14px; background: var(--s3); color: var(--on-sun); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 17px; box-shadow: 0 3px 0 var(--sun-deep); transform: rotate(-6deg); }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 22px; }
.sound-btn { display: inline-flex; align-items: center; gap: 7px; }
.sound-btn svg { width: 18px; height: 18px; flex: none; }
.sound-btn[aria-pressed="true"] { background: var(--s2-soft); border-color: var(--s2); box-shadow: 0 3px 0 var(--s2); }
.xp-pill { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 5px 14px 5px 6px; font-size: 14.5px; font-weight: 700; }
.xp-coin { background: var(--gold-soft); color: var(--gold); border-radius: 999px; padding: 2px 10px; font-weight: 800; font-size: 13.5px; }
.back { border: 2px solid var(--line); border-radius: 999px; padding: 7px 16px; font-size: 14.5px; font-weight: 700; background: var(--surface); box-shadow: 0 3px 0 var(--line); transition: transform .12s ease, border-color .15s ease; }
.back:hover { transform: translateY(-1px); border-color: var(--tone); }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 28px; align-items: center; padding-block: 14px 28px; }
.hero-copy { display: flex; flex-direction: column; gap: 18px; align-items: flex-start; }
.greet { display: inline-flex; align-items: center; gap: 9px; background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 6px 16px 6px 12px; font-weight: 800; font-size: 14.5px; }
.greet::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--s2); box-shadow: 0 0 0 4px var(--s2-soft); }
.hero h1 { font-size: clamp(46px, 7.5vw, 82px); font-weight: 700; letter-spacing: -.02em; line-height: 1.02; }
.hl { position: relative; white-space: nowrap; z-index: 0; color: var(--accent); }
.hl::after { content: ""; position: absolute; left: -4px; right: -6px; bottom: .08em; height: .3em; background: var(--s3); opacity: .5; border-radius: 999px; z-index: -1; transform: rotate(-1.5deg); }
.hero-copy > p { color: var(--muted); font-size: 19px; max-width: 50ch; }
.step-dots { list-style: none; margin: 0; padding: 0; display: flex; gap: 8px; flex-wrap: wrap; }
.step-dots li { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 800; padding: 4px 12px 4px 4px; border-radius: 999px; background: var(--tone-soft); }
.step-dots b { width: 24px; height: 24px; border-radius: 50%; background: var(--tone); color: var(--on-tone); display: grid; place-items: center; font-size: 13px; font-family: var(--font-display); font-weight: 700; }

/* fox friend card */
.pal { position: relative; background: linear-gradient(165deg, var(--den), var(--den-2)); border: 3px solid var(--surface); border-radius: 34px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; box-shadow: var(--lift); }
.pal .fox-wrap.big { width: 210px; }
.pal-name { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.pal-name h2 { font-size: 36px; overflow-wrap: anywhere; }
.stage-chip { font-size: 13px; font-weight: 800; color: var(--ink); background: var(--s5-soft); border: 2px solid var(--s5); border-radius: 999px; padding: 2px 12px; }
.growth { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; color: var(--muted); font-weight: 700; }
.growth .bar > i { background: var(--fox); }
.pal-actions { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: center; }
.pal-tip { font-size: 12.5px; color: var(--muted); font-weight: 700; }
.pal.adopt { text-align: left; align-items: stretch; }
.pal.adopt .fox-wrap { align-self: center; }
.pal.adopt h2 { font-size: 27px; }
.adopt-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.adopt-form input { flex: 1 1 180px; min-width: 0; border: 2px solid var(--line); border-radius: 999px; padding: 11px 18px; font: inherit; font-size: 17px; font-weight: 700; background: var(--surface); color: var(--ink); }
.adopt-form input:focus { border-color: var(--accent); outline: none; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 13px; font-size: 14px; font-weight: 700; transition: transform .12s ease, border-color .15s ease; }
.chip:hover { border-color: var(--s4); transform: translateY(-1px) rotate(-2deg); }
.bubble { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 10px 16px; font-size: 15px; font-weight: 600; position: relative; }
.pal .bubble { max-width: 300px; }
.pal .bubble::after { content: ""; position: absolute; left: 50%; bottom: -9px; width: 14px; height: 14px; background: var(--surface); border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: translateX(-50%) rotate(45deg); }

/* progress tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 14px; margin-bottom: 16px; }
.tile { background: var(--surface); border-radius: 24px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--lift); border: 2px solid var(--surface); min-width: 0; }
.tile.rank { grid-column: span 2; }
.tiles + section { margin-top: 18px; }
.tile .ico { width: 44px; height: 44px; border-radius: 15px; background: var(--tone-soft); display: grid; place-items: center; }
.tile .ico svg { width: 26px; height: 26px; }
.tile .ico.wide { width: auto; padding: 0 10px; justify-self: start; align-self: flex-start; }
.tile .ico.wide svg { width: auto; height: 22px; }
.tile b { font-family: var(--font-display); font-size: 28px; font-weight: 600; line-height: 1.1; }
.tile > span:last-child { font-size: 13.5px; color: var(--muted); font-weight: 700; }
.tile.rank .bar > i { background: var(--s3); }

/* wish journey */
.journey { background: var(--surface); border-radius: 26px; padding: 18px 20px 20px; box-shadow: var(--lift); display: flex; flex-direction: column; gap: 14px; margin-bottom: 34px; }
.journey-head { display: flex; justify-content: space-between; gap: 6px 14px; flex-wrap: wrap; align-items: baseline; }
.journey-head h2 { font-size: 22px; }
.journey ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; position: relative; }
.journey ol::before { content: ""; position: absolute; top: 27px; left: 10%; right: 10%; border-top: 3px dotted var(--line); }
.journey li { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; font-size: 13.5px; font-weight: 700; color: var(--muted); }
.jdot { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 3px dashed var(--line); }
.jdot svg { width: 30px; height: 30px; }
.journey li.done { color: var(--ink); }
.journey li.done .jdot { background: var(--tone-soft); border: 3px solid var(--tone); }
.journey li small { font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; }

/* forest map */
.forest { margin-bottom: 34px; }
.forest-map { position: relative; border-radius: 28px; overflow: hidden; box-shadow: var(--lift); border: 4px solid var(--surface); line-height: 0; }
.forest-art { display: block; width: 100%; height: auto; }
.stop { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 0; line-height: 1.2; z-index: 2; }
.stop b { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; background: var(--tone); color: var(--on-tone); font-family: var(--font-display); font-weight: 700; font-size: 22px; border: 4px solid #FFFFFF; box-shadow: 0 4px 0 color-mix(in srgb, var(--tone) 70%, #000 30%), 0 8px 18px rgba(20, 32, 58, .3); transition: transform .18s cubic-bezier(.3, 1.6, .5, 1); }
.stop.boss b { background: #FFB627; color: #3A2600; }
.stop:hover b, .stop:focus-visible b { transform: scale(1.12) rotate(-6deg); }
.stop-name { background: rgba(255, 255, 255, .92); color: #1D2943; font-size: 12.5px; font-weight: 800; padding: 2px 10px; border-radius: 999px; white-space: nowrap; box-shadow: 0 2px 6px rgba(20, 32, 58, .2); }
.stop-name i { font-style: normal; color: #D48C08; letter-spacing: 1px; }
.stop.next b { animation: stopPulse 1.8s ease-out infinite; }
@keyframes stopPulse { 0% { box-shadow: 0 4px 0 color-mix(in srgb, var(--tone) 70%, #000 30%), 0 0 0 0 color-mix(in srgb, var(--tone) 70%, transparent); } 100% { box-shadow: 0 4px 0 color-mix(in srgb, var(--tone) 70%, #000 30%), 0 0 0 18px transparent; } }
.map-fox { position: absolute; width: 11%; height: auto; transform: translate(-108%, -88%); z-index: 1; pointer-events: none; filter: drop-shadow(0 6px 8px rgba(20, 32, 58, .35)); animation: mapBob 2.4s ease-in-out infinite; }
@keyframes mapBob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -5px; } }
@media (max-width: 640px) {
  .forest-map { border-radius: 18px; border-width: 3px; }
  .stop b { width: 34px; height: 34px; font-size: 16px; border-width: 3px; }
  .stop-name { display: none; }
  .map-fox { width: 15%; }
}

/* fox */
.fox-wrap { position: relative; display: inline-block; line-height: 0; }
.fox-wrap.big { width: 220px; }
.fox-wrap[data-action="pet"] { cursor: pointer; border-radius: 28px; }
.fox { display: block; width: 100%; height: auto; overflow: visible; transform-origin: 50% 100%; }
.fox .tail { transform-origin: 128px 160px; animation: wag 3s ease-in-out infinite; }
.fox .eyes { transform-origin: 100px 84px; animation: blink 5s infinite; }
.fox .head { transform-origin: 100px 122px; }
@keyframes wag { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(6deg); } }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
.fox-wrap.tilt .head { animation: tilt 1.8s ease-in-out; }
.fox-art { user-select: none; -webkit-user-drag: none; filter: drop-shadow(0 10px 12px var(--shadow)); }
.fox-wrap.tilt .fox-art { animation: tiltArt 1.8s ease-in-out; }
@keyframes tiltArt { 0%, 100% { rotate: 0deg; } 25%, 70% { rotate: -6deg; } }
.pal .fox-art, .story-banner .fox-art { animation: breathe 4.5s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { scale: 1; } 50% { scale: 1.025; } }
@keyframes tilt { 0% { transform: rotate(0); } 20%, 70% { transform: rotate(-13deg); } 100% { transform: rotate(0); } }
.fox-wrap.hop { animation: hop .7s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes hop { 0%, 100% { transform: translateY(0); } 35% { transform: translateY(-18px); } }
.fox-wrap.knit { animation: sway 1.4s ease-in-out; }
@keyframes sway { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
.fox-wrap.wiggle { animation: wiggle .9s ease-in-out 2; }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-6deg) translateY(-4px); } 75% { transform: rotate(6deg) translateY(-4px); } }
.fx { position: absolute; pointer-events: none; line-height: 1; }
.fx.heart { left: 50%; top: 30%; width: 24px; height: 24px; animation: heartUp 1.3s ease-out forwards; }
@keyframes heartUp { from { transform: translate(var(--dx), 0) scale(.6); opacity: 0; } 20% { opacity: 1; } to { transform: translate(var(--dx), -80px) scale(1.1); opacity: 0; } }
.fx.spark { left: 50%; top: 45%; width: 16px; height: 16px; animation: spark .8s ease-out forwards; }
@keyframes spark { from { transform: translate(-50%, -50%) scale(.4); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1); opacity: 0; } }
.fx.qmark { right: 2%; top: 0; font-family: var(--font-display); font-weight: 700; font-size: 28px; color: var(--s5); animation: qm 1.8s ease-out forwards; }
@keyframes qm { from { transform: translateY(6px); opacity: 0; } 20%, 70% { opacity: 1; transform: none; } to { opacity: 0; } }
.fx.gain { right: 0; top: -4px; font-weight: 800; font-size: 15px; color: var(--gold); animation: rise 1.3s ease-out forwards; }
@keyframes rise { from { transform: translateY(6px); opacity: 0; } 20% { opacity: 1; } to { transform: translateY(-24px); opacity: 0; } }
.pop { transform-box: fill-box; transform-origin: center; animation: popIn .55s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
.draw { stroke-dasharray: 1; animation: draw .9s ease-out both; }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }

/* level map */
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.section-head h2 { font-size: 32px; }
.map { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 18px; }
.lvl { position: relative; overflow: hidden; text-align: left; background: var(--surface); border: 3px solid var(--surface); border-radius: 28px; padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 9px; box-shadow: var(--lift); transition: transform .2s cubic-bezier(.3, 1.4, .5, 1), border-color .15s ease; }

/* =====================================================================
   Companion mechanics
   ===================================================================== */
const toastQ = [];
let toastLive = 0;
function toast(html) { toastQ.push(html); pumpToasts(); }
function pumpToasts() {
  const box = document.getElementById("toasts");
  while (toastLive < 2 && toastQ.length) {
    const t = document.createElement("div");
    t.className = "toast";
    t.innerHTML = toastQ.shift();
    box.appendChild(t);
    toastLive++;
    setTimeout(() => {
      t.classList.add("out");
      setTimeout(() => { t.remove(); toastLive--; pumpToasts(); }, 450);
    }, 3200);
  }
}
function unlock(id) {
  if (!adopted() || comp.moments[id]) return false;
  comp.moments[id] = new Date().toISOString().slice(0, 10);
  saveComp();
  const m = MOMENT[id];
  toast(sceneSvg(id) + '<div><span class="toast-k">' + (m.rare ? "Rare moment unlocked" : "New scrapbook moment") + '</span><b>' + m.title + '</b></div>');
  updateTopbar();
  return true;
}
function checkGrowth() {
  const st = stageFor(comp.acorns);
  if (st <= comp.stage) return false;
  comp.stage = st;
  saveComp();
  toast(sceneSvg(st >= 4 ? "wise" : "grow") + '<div><span class="toast-k">Growth stage</span><b>' + nm() + ' grew into a ' + STAGES[st].name.toLowerCase() + '!</b></div>');
  if (st >= 1) unlock("grow");
  if (st >= 4) unlock("wise");
  return true;
}
function compAnswer(q, score, second) {
  if (!adopted()) return null;
  const full = score >= 0.999;
  let gain = Math.round(score * 3);
  comp.combo = full ? comp.combo + 1 : 0;
  comp.bestCombo = Math.max(comp.bestCombo, comp.combo);
  if (full && comp.combo >= 3) gain += 1;
  let golden = false;
  if (full && comp.combo >= 3 && Math.random() < 0.08) { golden = true; gain += 10; }
  comp.acorns += gain;
  let scarfDone = false;
  if (q.ot && score > 0) {
    comp.rows += score;
    if (comp.rows >= SCARF_ROWS - 1e-9) {
      comp.rows = Math.max(0, comp.rows - SCARF_ROWS);
      if (comp.rows < 1e-6) comp.rows = 0;
      comp.scarves++;
      scarfDone = true;
    }
  }
  saveComp();
  if (second && score > 0) unlock("retry");
  if (comp.combo >= 5) unlock("shooting");
  if (comp.combo >= 10) unlock("fireflies");
  if (comp.combo >= 20) unlock("aurora");
  if (golden && !unlock("golden")) toast(sceneSvg("golden") + '<div><span class="toast-k">Lucky find</span><b>Another golden acorn! +10 acorns</b></div>');
  if (comp.acorns >= 100) unlock("hundred");
  if (scarfDone) unlock("scarf");
  checkGrowth();
  saveComp();
  return { gain: gain, scarfDone: scarfDone, golden: golden };
}
function compLevel(l, stars) {
  if (!adopted()) return null;
  const st = STORY[l.id];
  if (stars === 3) unlock("perfect");
  if (LEVELS.every(x => progress[x.id] && progress[x.id].stars === 3)) unlock("allgold");
  if (stars < 1) return nm() + " curls up for a rest. Earn at least one star to finish the " + st.label.toLowerCase() + " part of the story.";
  let text;
  if (l.id === "boss") {
    unlock("festival");
    text = "Every lantern is lit. " + nm() + " dances through the year-end festival.";
  } else if (l.id === "timing") {
    const need = JOURNEY.slice(0, 4).filter(id => !comp.journey[id]);
    if (need.length) {
      text = nm() + "'s wish isn't ready yet. Recognition comes last, so first finish: " + need.map(id => STORY[id].label.toLowerCase()).join(", ") + ".";
    } else {
      comp.wishes++;
      comp.journey = {};
      saveComp();
      unlock("wish");
      queueOverlay(wishOverlay());
      text = nm() + "'s wish #" + comp.wishes + " came true! A new wish starts back at Step 1.";
    }
  } else {
    comp.journey[l.id] = true;
    unlock(st.moment);
    const done = JOURNEY.slice(0, 4).filter(id => comp.journey[id]).length;
    text = nm() + " finished the " + st.label.toLowerCase() + ". Wish #" + (comp.wishes + 1) + ": " + done + " of 4 steps ready before it can come true in Step 5.";
  }
  saveComp();
  return text;
}
function wishOverlay() {
  return '<span class="eyebrow">Step 5 · Recognition</span>' + wishScene() +
    '<h2>Wish #' + comp.wishes + ' came true!</h2>' +
    '<p>' + nm() + '\'s drawing became a real kite. The wish was drawn (contract), split into parts (performance obligations), saved for (transaction price), shared out (allocation) and finally delivered (recognition).</p>';
}
function scarfOverlay() {
  const col = CRAY[(comp.scarves - 1) % CRAY.length];
  return '<span class="eyebrow">Over-time obligation complete</span>' + sceneSvg("scarf", "big-scene", { scarf: col }) +
    '<h2>Scarf #' + comp.scarves + ' is finished!</h2>' +
    '<p>Each over-time answer knitted one row. Revenue for an over-time obligation builds the same way: bit by bit as you perform, not all at once at the end. ' + nm() + ' is wearing it now.</p>';
}

/* overlays */
const overlayQ = [];
let overlayOpen = false;
let lastFocus = null;
function queueOverlay(html) { overlayQ.push(html); if (!overlayOpen) nextOverlay(); }
function nextOverlay() {
  const html = overlayQ.shift();
  if (!html) {
    overlayOpen = false;
    if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
    lastFocus = null;
    return;
  }
  if (!overlayOpen) lastFocus = document.activeElement;
  overlayOpen = true;
  const o = document.createElement("div");
  o.className = "overlay";
  o.setAttribute("role", "dialog");
  o.setAttribute("aria-modal", "true");
  o.innerHTML = '<div class="overlay-card">' + html + '<div class="actions"><button class="btn" data-action="close-overlay">Continue</button></div></div>';
  document.body.appendChild(o);
  o.querySelector("button").focus({ preventScroll: true });
}
function closeOverlay() {
  const o = document.querySelector(".overlay");
  if (o) o.remove();
  nextOverlay();
}

/* fox reactions */
function animate(el, cls) {
  if (!el) return;
  el.classList.remove("hop", "knit", "tilt", "wiggle");
  void el.offsetWidth;
  el.classList.add(cls);
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove(cls), 2000);
  if (reduced()) return;
  if (cls === "tilt") fx(el, "qmark", "?");
  if (cls === "hop") {
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + Math.random() * 0.5;
      fx(el, "spark", '<svg viewBox="0 0 24 24"><path d="' + STAR + '" fill="' + CRAY[i % CRAY.length] + '"/></svg>', { dx: Math.cos(a) * 46 + "px", dy: Math.sin(a) * 40 + "px" });
    }
  }
}
function fx(el, cls, html, vars) {
  const sp = document.createElement("span");
  sp.className = "fx " + cls;
  sp.setAttribute("aria-hidden", "true");
  sp.innerHTML = html;
  if (vars) Object.keys(vars).forEach(k => sp.style.setProperty("--" + k, vars[k]));
  el.appendChild(sp);
  setTimeout(() => sp.remove(), 1900);
}
function setBubble(text) { const b = document.getElementById("bubble"); if (b) b.innerHTML = text; }
function miniStats() {
  return '<span title="Acorns saved">' + acornIcon + '<b>' + comp.acorns + '</b></span>' +
    '<span title="Scarf in progress">' + scarfSvg(comp.rows, CRAY[comp.scarves % CRAY.length]) + '</span>';
}
function dockHtml(l) {
  if (!adopted()) return "";
  const filled = S.results.filter(r => r.score >= 0.5).length;
  const line = S.qi === 0 ? STORY[l.id].start : say(pick(IDLE_LINES));
  return '<div class="dock">' +
    '<div class="fox-wrap" id="dock-fox">' + curFox() + '</div>' +
    '<div class="dock-main"><p class="bubble" id="bubble">' + line + '</p>' +
    '<div class="dock-row"><div class="story" id="story">' + storyItem(l.id, filled, l.qs.length, -1) + '</div>' +
    '<div class="mini-stats" id="mini-stats">' + miniStats() + '</div></div></div></div>';
}
function dockReact(l, q, score, cr, second) {
  const wrap = document.getElementById("dock-fox");
  if (!wrap || !cr) return;
  let line, anim;
  const rowsTxt = cr.scarfDone ? "the scarf is finished!" : "row " + Math.floor(comp.rows) + " of " + SCARF_ROWS + ".";
  if (score > 0 && q.ot) {
    anim = "knit";
    line = nm() + " knits " + (score >= 0.999 ? "a row" : "a little more") + " of the scarf: " + rowsTxt;
  } else if (score >= 0.999 || (second && score > 0)) {
    anim = "hop";
    line = STORY[l.id].win + (second ? " Nice second look." : "");
  } else if (score > 0) {
    anim = "hop";
    line = nm() + " nods slowly. Partly there.";
  } else {
    anim = "tilt";
    line = say(pick(TILT_FINAL));
  }
  if (cr.golden) line += " And a golden acorn! +10.";
  wrap.innerHTML = curFox({ pose: anim === "hop" ? "cheer" : anim });
  setBubble(line);
  animate(wrap, anim);
  const filled = S.results.filter(r => r.score >= 0.5).length;
  const story = document.getElementById("story");
  if (story) story.innerHTML = storyItem(l.id, filled, l.qs.length, score >= 0.5 ? filled - 1 : -1);
  const ms = document.getElementById("mini-stats");
  if (ms) {
    ms.innerHTML = miniStats();
    if (cr.gain > 0 && !reduced()) fx(ms, "gain", "+" + cr.gain);
  }
}

/* =====================================================================
   Questions
   ===================================================================== */
function startLevel(li) {
  S = { li: li, qi: 0, results: [], xp: 0, streak: 0, done: false, picks: [], attempt: 0 };
  renderQuestion();
}

function renderQuestion() {
  const l = LEVELS[S.li];
  const q = l.qs[S.qi];
  S.done = false;
  S.attempt = 0;
  S.picks = q.type === "sort" ? q.items.map(() => -1) : [];
  const keys = "ABCD";
  let body = "";
  if (q.scenario) body += '<div class="case"><span class="eyebrow">Case</span><p>' + q.scenario + '</p></div>';
  body += '<p class="prompt">' + q.prompt + '</p>';

  if (q.type === "choice") {
    body += '<div class="opts">' + q.options.map((o, i) =>
      '<button class="opt" data-action="pick" data-i="' + i + '"><span class="key">' + keys[i] + '</span><span>' + o + '</span></button>').join("") + '</div>';
  } else if (q.type === "stamp") {
    body += '<div class="stamp-opts">' + q.options.map((o, i) =>
      '<button class="stamp-btn" data-action="pick" data-i="' + i + '">' + o + '</button>').join("") + '</div>';
  } else if (q.type === "number") {
    body += '<div class="actions"><label class="numrow" for="num-input"><span>CU</span><input id="num-input" inputmode="decimal" autocomplete="off" placeholder="e.g. 1,000,000" aria-label="Your answer in currency units"></label>' +
      '<button class="btn" data-action="check-num">Check</button></div>';
  } else if (q.type === "alloc") {
    const tot = q.items.reduce((a, it) => a + it.ssp, 0);
    body += '<div class="tbl-wrap"><table class="alloc"><thead><tr><th>Obligation</th><th>SSP</th><th>Your allocation</th></tr></thead><tbody>' +
      q.items.map((it, i) => '<tr><td>' + it.name + '</td><td class="num">' + fmt(it.ssp) + '</td><td><input id="alloc-' + i + '" inputmode="decimal" autocomplete="off" aria-label="Allocation to ' + it.name + '"></td></tr>').join("") +
      '</tbody><tfoot><tr><td>Total</td><td class="num">' + fmt(tot) + '</td><td class="num">' + fmt(q.price) + '</td></tr></tfoot></table></div>' +
      '<p class="hint">Allocation = transaction price × item SSP ÷ total SSP. Round to whole CU.</p>' +
      '<div class="actions"><button class="btn" data-action="check-alloc">Check allocation</button></div>';
  } else if (q.type === "sort") {
    body += '<div class="sort">' + q.items.map((it, i) =>
      '<div class="sort-row" id="sort-' + i + '"><span>' + it.text + '</span><span class="seg" role="group" aria-label="Classify">' +
      q.bins.map((b, k) => '<button data-action="sort" data-item="' + i + '" data-bin="' + k + '" aria-pressed="false">' + b + '</button>').join("") +
      '</span></div>').join("") + '</div>' +
      '<div class="actions"><button class="btn" data-action="check-sort" disabled>Check answers</button><span class="hint" id="sort-left">' + q.items.length + ' left to sort</span></div>';
  }

  const progressPct = Math.round((S.qi / l.qs.length) * 100);
  view.innerHTML =
    '<div class="stage" ' + toneStyle(S.li) + '>' +
      '<div class="crumbs"><button class="back" data-action="home">← Level map</button><span class="eyebrow">' + l.step + ' · ' + l.title + '</span></div>' +
      '<div class="hud"><span class="mono">' + (S.qi + 1) + ' / ' + l.qs.length + '</span><div class="bar"><i style="width:' + progressPct + '%"></i></div>' +
        '<span class="mono">' + S.xp + ' XP</span>' + (S.streak >= 2 ? '<span class="streak">Streak ×' + S.streak + '</span>' : "") + '</div>' +
      dockHtml(l) +
      '<article class="card" id="qcard">' + body + '<div id="fb" class="fb"></div></article>' +
    '</div>';
  scrollTop();
  const first = view.querySelector("#num-input, #alloc-0");
  if (first) first.focus({ preventScroll: true });
}

function parseNum(v) {
  const s = String(v || "").replace(/[^0-9.\-]/g, "");
  if (s === "" || s === "-" || s === ".") return NaN;
  return parseFloat(s);
}

/* =====================================================================
   Fox voice (off until the player switches it on)
   ===================================================================== */
const SKEY = "ifrs15-revenue-quest-sound";
const VOICE = {
  correct: ["correct-1", "correct-2", "correct-3", "correct-4", "correct-5", "correct-6", "correct-7", "correct-8"],
  streak: ["streak-1", "streak-2"],
  retry: ["retry-right"],
  wrong: ["wrong-1", "wrong-2"],
  done: ["level-done"]
};
let soundOn = false;
try { soundOn = localStorage.getItem(SKEY) === "on"; } catch (e) {}
let voiceNow = null;
let voiceLast = "";
function speak(kind) {
  if (!soundOn || !VOICE[kind]) return;
  const opts = VOICE[kind].filter(f => f !== voiceLast);
  const file = pick(opts.length ? opts : VOICE[kind]);
  voiceLast = file;
  try {
    if (voiceNow) voiceNow.pause();
    voiceNow = new Audio("assets/voice/" + file + ".mp3");
    voiceNow.volume = 0.9;
    const p = voiceNow.play();
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}
function soundIcon(on) {
  return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke="none"/>' +
    (on ? '<path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>' : '<path d="M16 9.5l5 5M21 9.5l-5 5"/>') + '</svg>';
}
function updateSoundBtn() {
  const b = document.getElementById("sound-btn");
  b.innerHTML = soundIcon(soundOn) + '<span>Fox voice ' + (soundOn ? "on" : "off") + '</span>';
  b.setAttribute("aria-pressed", soundOn ? "true" : "false");
  b.setAttribute("aria-label", soundOn ? "Turn the fox voice off" : "Turn the fox voice on");
}
function toggleSound() {
  soundOn = !soundOn;
  try { localStorage.setItem(SKEY, soundOn ? "on" : "off"); } catch (e) {}
  updateSoundBtn();
  if (soundOn) speak("correct");
  else if (voiceNow) voiceNow.pause();
}

function showRetry() {
  speak("wrong");
  const fb = document.getElementById("fb");
  const line = adopted() ? say(pick(TILT_RETRY)) : "Not quite. Have another look?";
  fb.className = "fb retry";
  fb.innerHTML = '<div class="retry-row"><p>' + line + ' A correct second try earns half XP.</p><button class="btn ghost small" data-action="reveal">Show me the answer</button></div>';
  if (adopted()) {
    setBubble(line);
    const w = document.getElementById("dock-fox");
    if (w) { w.innerHTML = curFox({ pose: "tilt" }); animate(w, "tilt"); }
  }
}

function finish(score, detail, second) {
  if (S.done) return;
  S.done = true;
  const l = LEVELS[S.li];
  const q = l.qs[S.qi];
  const full = score >= 0.999;
  const bonus = full ? Math.min(S.streak, 5) * 20 : 0;
  const gained = Math.round(100 * score) + bonus;
  S.xp += gained;
  S.streak = full ? S.streak + 1 : 0;
  S.results.push({ score: score, prompt: q.prompt, scenario: q.scenario });

  const cr = compAnswer(q, score, second);
  if (full) speak(S.streak >= 3 ? (S.streak % 2 ? "streak" : "correct") : "correct");
  else if (second && score > 0) speak("retry");
  else if (score === 0 && !S.attempt) speak("wrong");

  const cls = full ? "good" : score >= 0.5 ? "mid" : "bad";
  const verdict = full ? (bonus ? "On a roll! Streak bonus" : pick(["Nailed it!", "Spot on!", "Yes, exactly!"])) : second && score > 0 ? "Got it on the second look" : score > 0 ? "Partly right, nice work" : "Not quite, and that's okay";
  const stamp = full ? "Recognised" : score > 0 ? "Partly<br>recognised" : "Reversal";
  const last = S.qi === l.qs.length - 1;
  let note = "";
  if (cr && score > 0) {
    note = q.ot
      ? '<p class="story-note"><span class="po-chip">Over time</span><span>The key obligation in this case is satisfied over time, so ' + nm() + ' knitted ' + (full ? "a row" : "part of a row") + ' of the scarf.</span></p>'
      : '<p class="story-note"><span class="po-chip">Point in time</span><span>The key obligation here is satisfied at a point in time, so ' + nm() + ' reacted straight away. +' + cr.gain + ' acorns.</span></p>';
  }

  const fb = document.getElementById("fb");
  fb.className = "fb";
  fb.innerHTML =
    '<div class="stamp ' + cls + '" aria-hidden="true">' + stamp + '</div>' +
    '<div class="fb-head"><span class="verdict ' + cls + '">' + verdict + '</span><span class="xp-gain">+' + gained + ' XP</span></div>' +
    (detail ? '<p class="explain">' + detail + '</p>' : "") +
    '<p class="explain">' + q.explain + '</p>' + note +
    '<div class="actions"><button class="btn" data-action="next">' + (last ? "See results" : "Next case →") + '</button></div>';
  dockReact(l, q, score, cr, second);
  fb.querySelector('[data-action="next"]').focus({ preventScroll: true });
  fb.scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "nearest" });
  if (cr && cr.scarfDone) queueOverlay(scarfOverlay());
}

function onPick(i) {
  if (S.done) return;
  const q = LEVELS[S.li].qs[S.qi];
  const btns = Array.from(view.querySelectorAll('[data-action="pick"]'));
  if (i !== q.answer && q.type === "choice" && S.attempt === 0) {
    S.attempt = 1;
    btns[i].classList.add("wrong");
    btns[i].disabled = true;
    showRetry();
    return;
  }
  const second = S.attempt === 1;
  btns.forEach((b, k) => {
    b.disabled = true;
    if (k === q.answer) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
  });
  if (i === q.answer) finish(second ? 0.5 : 1, second ? "Right on the second try, for half XP." : "", second);
  else finish(0, "The answer is <b>" + q.options[q.answer] + "</b>.", false);
}

function onReveal() {
  if (S.done) return;
  const q = LEVELS[S.li].qs[S.qi];
  if (q.type === "number") {
    const inp = document.getElementById("num-input");
    inp.disabled = true;
    view.querySelector('[data-action="check-num"]').disabled = true;
    finish(0, "The answer is <b>" + fmt(q.answer) + "</b>.", false);
    return;
  }
  view.querySelectorAll('[data-action="pick"]').forEach((b, k) => {
    b.disabled = true;
    if (k === q.answer) b.classList.add("correct");
  });
  finish(0, "The answer is <b>" + q.options[q.answer] + "</b>.", false);
}

function onCheckNum() {
  if (S.done) return;
  const q = LEVELS[S.li].qs[S.qi];
  const inp = document.getElementById("num-input");
  const v = parseNum(inp.value);
  if (isNaN(v)) { inp.placeholder = "Enter a number first"; inp.focus(); return; }
  const ok = Math.abs(v - q.answer) <= (q.tol || 0.5);
  const row = inp.parentElement;
  row.classList.remove("wrong");
  if (!ok && S.attempt === 0) {
    S.attempt = 1;
    void row.offsetWidth;
    row.classList.add("wrong");
    inp.select();
    showRetry();
    return;
  }
  const second = S.attempt === 1;
  inp.disabled = true;
  row.classList.add(ok ? "correct" : "wrong");
  view.querySelector('[data-action="check-num"]').disabled = true;
  if (ok) finish(second ? 0.5 : 1, second ? "Right on the second try, for half XP." : "", second);
  else finish(0, "You entered " + fmt(v) + ". The answer is <b>" + fmt(q.answer) + "</b>.", false);
}

function onCheckAlloc() {
  if (S.done) return;
  const q = LEVELS[S.li].qs[S.qi];
  const tot = q.items.reduce((a, it) => a + it.ssp, 0);
  const vals = q.items.map((it, i) => parseNum(document.getElementById("alloc-" + i).value));
  if (vals.some(isNaN)) { document.getElementById("alloc-" + vals.findIndex(isNaN)).focus(); return; }
  let right = 0;
  const answers = q.items.map(it => Math.round(q.price * it.ssp / tot));
  q.items.forEach((it, i) => {
    const el = document.getElementById("alloc-" + i);
    const ok = Math.abs(vals[i] - answers[i]) <= 1;
    if (ok) right++;
    el.disabled = true;
    el.classList.add(ok ? "correct" : "wrong");
  });
  view.querySelector('[data-action="check-alloc"]').disabled = true;
  const split = '<span class="split" style="display:flex" role="img" aria-label="Correct allocation">' + q.items.map((it, i) =>
    '<div style="flex:' + answers[i] + '" title="' + it.name + '">' + fmt(answers[i]) + '</div>').join("") + '</span>';
  const list = q.items.map((it, i) => it.name + " <b>" + fmt(answers[i]) + "</b>").join(" · ");
  finish(right / q.items.length, split + '<span style="display:block;margin-top:8px">Correct allocation: ' + list + '</span>', false);
}

function onSort(item, bin) {
  if (S.done) return;
  S.picks[item] = bin;
  const row = document.getElementById("sort-" + item);
  row.querySelectorAll("button").forEach(b => {
    const on = Number(b.dataset.bin) === bin;
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", on ? "true" : "false");
  });
  const left = S.picks.filter(p => p < 0).length;
  document.getElementById("sort-left").textContent = left ? left + " left to sort" : "All sorted";
  view.querySelector('[data-action="check-sort"]').disabled = left > 0;
}

function onCheckSort() {
  if (S.done) return;
  const q = LEVELS[S.li].qs[S.qi];
  let right = 0;
  q.items.forEach((it, i) => {
    const row = document.getElementById("sort-" + i);
    const ok = S.picks[i] === it.bin;
    if (ok) right++;
    row.classList.add(ok ? "correct" : "wrong");
    row.querySelectorAll("button").forEach(b => { b.disabled = true; });
    const why = document.createElement("span");
    why.className = "why";
    why.innerHTML = (ok ? "" : "<b>" + q.bins[it.bin] + ".</b> ") + it.why;
    row.appendChild(why);
  });
  view.querySelector('[data-action="check-sort"]').disabled = true;
  finish(right / q.items.length, "You sorted " + right + " of " + q.items.length + " correctly.", false);
}

function onNext() {
  const l = LEVELS[S.li];
  if (S.qi < l.qs.length - 1) { S.qi++; renderQuestion(); }
  else renderResults();
}

/* =====================================================================
   Results
   ===================================================================== */
function renderResults() {
  const l = LEVELS[S.li];
  const sum = S.results.reduce((a, r) => a + r.score, 0);
  const pct = sum / l.qs.length;
  const stars = starsFor(pct);
  const prev = progress[l.id];
  const best = !prev || S.xp > prev.xp;
  if (best) progress[l.id] = { xp: S.xp, stars: Math.max(stars, prev ? prev.stars : 0) };
  else if (stars > prev.stars) progress[l.id].stars = stars;
  save();
  updateTopbar();
  const storyText = compLevel(l, stars);

  const headline = stars === 3 ? "Clean audit opinion" : stars === 2 ? "Minor adjustments" : stars === 1 ? "Management letter points" : "Back to the standard";
  const nextLi = S.li < LEVELS.length - 1 ? S.li + 1 : -1;
  const review = S.results.map(r => {
    const c = r.score >= 0.999 ? "good" : r.score > 0 ? "mid" : "bad";
    const label = r.scenario ? r.scenario.split(". ")[0].replace(/\.$/, "") + "." : r.prompt;
    return '<div class="review-item"><span class="dot ' + c + '"></span><span>' + label + '</span></div>';
  }).join("");

  view.innerHTML =
    '<div class="stage" ' + toneStyle(S.li) + '>' +
      '<div class="crumbs"><button class="back" data-action="home">← Level map</button><span class="eyebrow">' + l.step + ' complete</span></div>' +
      '<article class="card results">' +
        starsRow(stars, true) +
        '<h2>' + headline + '</h2>' +
        '<p class="hint">' + l.title + (best ? ' · <span class="new-best">New best score</span>' : "") + '</p>' +
        '<div class="stats">' +
          '<div class="stat"><b>' + Math.round(pct * 100) + '%</b><span>Accuracy</span></div>' +
          '<div class="stat"><b>' + S.xp + '</b><span>XP this run</span></div>' +
          '<div class="stat"><b>' + totalXp().toLocaleString("en-US") + '</b><span>Total XP</span></div>' +
        '</div>' +
        (storyText ? '<div class="story-result"><div class="fox-wrap' + (stars >= 1 ? " wiggle" : " tilt") + '">' + curFox({ pose: stars >= 1 ? "cheer" : "tilt" }) + '</div><p>' + storyText + '</p></div>' : "") +
        '<div class="review">' + review + '</div>' +
        '<div class="actions">' +
          (nextLi >= 0 ? '<button class="btn" data-action="intro" data-level="' + nextLi + '">Next: ' + LEVELS[nextLi].title + ' →</button>' : '<button class="btn" data-action="home">Back to the map</button>') +
          '<button class="btn ghost" data-action="start-again">Replay level</button>' +
        '</div>' +
      '</article>' +
    '</div>';
  scrollTop();
  if (stars === 3) confetti();
  if (stars >= 1) speak("done");
}

/* =====================================================================
   Confetti
   ===================================================================== */
function confetti() {
  if (reduced()) return;
  const c = document.getElementById("confetti");
  const ctx = c.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--accent", "--gold", "--c1", "--c4", "--c5"].map(v => cs.getPropertyValue(v).trim());
  const ps = Array.from({ length: 140 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 160, y: innerHeight * 0.35,
    vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 4,
    w: 6 + Math.random() * 6, h: 4 + Math.random() * 4, r: Math.random() * 6, vr: (Math.random() - .5) * .3,
    c: cols[Math.floor(Math.random() * cols.length)]
  }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => {
      p.vy += 0.35; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    });
    if (t - t0 < 2600) requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

/* =====================================================================
   Events
   ===================================================================== */
function pet() {
  const wrap = document.getElementById("den-fox");
  if (!wrap) return;
  const im = wrap.querySelector("img");
  if (im) {
    im.src = "assets/fox/cheer.webp";
    clearTimeout(wrap._pose);
    wrap._pose = setTimeout(() => { im.src = "assets/fox/" + restPose() + ".webp"; }, 1700);
  }
  animate(wrap, "wiggle");
  if (!reduced()) for (let i = 0; i < 3; i++) setTimeout(() => fx(wrap, "heart", '<svg viewBox="0 0 24 24"><path d="' + HEART + '" fill="var(--blush)"/></svg>', { dx: (Math.random() * 80 - 50) + "px" }), i * 160);
  const b = document.getElementById("den-bubble");
  if (b) b.innerHTML = say(pick(PET_LINES));
  unlock("pat");
}
function adopt(name) {
  const clean = name.trim().replace(/\s+/g, " ").slice(0, 16);
  if (!clean) { const i = document.getElementById("fox-name"); if (i) { i.placeholder = "Type a name first"; i.focus(); } return; }
  const first = !adopted();
  comp.name = clean;
  saveComp();
  renaming = false;
  renderHome();
  if (first) unlock("welcome");
  const f = document.getElementById("den-fox");
  if (f) { animate(f, "hop"); f.focus({ preventScroll: true }); }
}

document.addEventListener("submit", e => {
  if (e.target.id === "adopt-form") { e.preventDefault(); adopt(document.getElementById("fox-name").value); }
});
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el || el.disabled) return;
  const a = el.dataset.action;
  if (a !== "reset" && resetArmed) resetArmed = false;
  switch (a) {
    case "home": renaming = false; renderHome(); scrollTop(); break;
    case "intro": renderIntro(Number(el.dataset.level)); break;
    case "start": case "start-again": startLevel(S.li); break;
    case "pick": onPick(Number(el.dataset.i)); break;
    case "reveal": onReveal(); break;
    case "check-num": onCheckNum(); break;
    case "check-alloc": onCheckAlloc(); break;
    case "sort": onSort(Number(el.dataset.item), Number(el.dataset.bin)); break;
    case "check-sort": onCheckSort(); break;
    case "next": onNext(); break;
    case "pet": pet(); break;
    case "scrapbook": renderScrapbook(); break;
    case "rename": renaming = true; renderHome(); { const i = document.getElementById("fox-name"); if (i) i.focus(); } break;
    case "cancel-rename": renaming = false; renderHome(); break;
    case "suggest": { const i = document.getElementById("fox-name"); if (i) { i.value = el.dataset.name; i.focus(); } break; }
    case "close-overlay": closeOverlay(); break;
    case "sound": toggleSound(); break;
    case "reset":
      if (!resetArmed) { resetArmed = true; el.textContent = "Click again to erase all progress and your fox"; el.classList.add("armed"); }
      else { resetArmed = false; progress = {}; comp = freshComp(); save(); saveComp(); renaming = false; renderHome(); }
      break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && overlayOpen) { closeOverlay(); return; }
  const t = e.target;
  if ((e.key === "Enter" || e.key === " ") && t.dataset && t.dataset.action === "pet") { e.preventDefault(); pet(); return; }
  if (e.key !== "Enter" || !S || S.done || S.qi === undefined) return;
  if (t.id === "num-input") { e.preventDefault(); onCheckNum(); }
  else if (t.id && t.id.indexOf("alloc-") === 0) {
    e.preventDefault();
    const nx = document.getElementById("alloc-" + (Number(t.id.slice(6)) + 1));
    if (nx) nx.focus(); else onCheckAlloc();
  }
});

updateSoundBtn();
renderHome();
})();
</script>
